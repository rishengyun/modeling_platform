<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>嵌入登录加密测试</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
    .panel {
      background: #fff; margin: 16px 16px 0; padding: 16px;
      border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .panel h3 { margin-bottom: 12px; color: #d32f2f; }
    .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
    .row label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
    .row input { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; width: 200px; }
    button { padding: 7px 20px; background: #d32f2f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #c62828; }
    code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-size: 13px; word-break: break-all; }
    .token-box { background: #fff3e0; border-left: 3px solid #ff9800; padding: 10px; margin-top: 8px; font-size: 13px; word-break: break-all; }
    .info { font-size: 13px; color: #888; margin-top: 8px; }
    iframe { width: 100%; height: calc(100vh - 260px); border: none; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="panel">
    <h3>🔐 加密嵌入登录测试</h3>
    <div class="row">
      <div>
        <label>共享密钥 (secret)</label>
        <input id="secret" value="tB70xG5_1T3j2doRFJ1LUW1EKZk4bpmkKCpAJ9gBYqs" style="width:420px">
      </div>
    </div>
    <div class="row">
      <div>
        <label>用户名</label>
        <input id="username" value="sdustgy">
      </div>
      <div>
        <label>密码</label>
        <input id="password" value="sdustgy">
      </div>
      <div>
        <label>建模平台地址</label>
        <input id="baseUrl" value="http://localhost:9877" style="width:240px">
      </div>
      <button onclick="generateAndLoad()">🔒 加密并加载</button>
    </div>
    <div id="tokenDisplay" style="display:none" class="token-box">
      <strong>生成的 token:</strong><br>
      <code id="tokenText"></code>
      <br><br>
      <strong>完整 URL:</strong><br>
      <code id="fullUrl"></code>
    </div>
    <div class="info">
      ✅ 算法: AES-256-CBC · 密钥派生: SHA-256 · 格式: Base64URL(IV+Ciphertext) · 后端零改动
    </div>
  </div>
  <iframe id="embedFrame" src="about:blank"></iframe>

  <script>
    function generateAndLoad() {
      const secret = document.getElementById('secret').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const baseUrl = document.getElementById('baseUrl').value;

      // CryptoJS 加密（与父系统一致的写法）
      const key = CryptoJS.SHA256(secret);
      const iv = CryptoJS.lib.WordArray.random(16);
      const encrypted = CryptoJS.AES.encrypt(username + ':' + password, key, { iv: iv });
      const token = CryptoJS.enc.Base64url.stringify(iv.clone().concat(encrypted.ciphertext));

      const url = baseUrl + '/datascreen?token=' + encodeURIComponent(token);

      document.getElementById('tokenDisplay').style.display = 'block';
      document.getElementById('tokenText').textContent = token;
      document.getElementById('fullUrl').textContent = url;

      document.getElementById('embedFrame').src = url;
    }
  </script>
</body>
</html>
